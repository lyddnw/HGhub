name: Android APK (self-signed)

# 手动触发：在 Actions 页点 Run workflow，产物在 artifacts 里下载。
# 签名用 CI 内临时生成的 keystore（仅供个人安装，不可用于上架或覆盖更新其他来源的包）。
on:
  workflow_dispatch:

env:
  CI: "true"

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（arm64）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64

      - name: 临时签名
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/temp.keystore"
          keytool -genkeypair -v -keystore "$KS" -alias hghub -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass hghubtemp -keypass hghubtemp -dname "CN=HGhub Local Build" >/dev/null 2>&1
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/$BT"
          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            aligned="$RUNNER_TEMP/aligned-$abi.apk"
            "$TOOLS/zipalign" -p -f 4 "$f" "$aligned"
            out="artifacts/HGhub_${VERSION}_${abi}.apk"
            "$TOOLS/apksigner" sign --ks "$KS" --ks-key-alias hghub \
              --ks-pass pass:hghubtemp --key-pass pass:hghubtemp \
              --v4-signing-enabled false --out "$out" "$aligned"
            "$TOOLS/apksigner" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*
          if-no-files-found: error

name: Windows EXE

# 手动触发：产出 NSIS 安装包 + 免安装便携版。
on:
  workflow_dispatch:

env:
  CI: "true"

jobs:
  windows:
    name: Windows (setup + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis

      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/huangguo-client.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhub.exe"
          Compress-Archive -Path "artifacts/HGhub.exe" -DestinationPath "artifacts/HGhub_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhub.exe"
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: artifacts/*
          if-no-files-found: error
